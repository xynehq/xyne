apiVersion: v1
kind: Secret
metadata:
  name: {{ include "xyne.fullname" . }}-app
  labels:
    {{- include "xyne.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "xyne.databaseUrl" . | quote }}
  {{- range $key, $value := .Values.app.secrets }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
