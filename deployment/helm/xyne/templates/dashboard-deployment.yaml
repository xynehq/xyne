{{- if .Values.sdkDashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xyne.fullname" . }}-dashboard
  labels:
    {{- include "xyne.labels" . | nindent 4 }}
    {{- include "xyne.dashboard.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.sdkDashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "xyne.dashboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "xyne.dashboard.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: dashboard
          image: "{{ .Values.sdkDashboard.image }}:{{ .Values.sdkDashboard.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.sdkDashboard.port }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          resources:
            {{- toYaml .Values.sdkDashboard.resources | nindent 12 }}
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "xyne.fullname" . }}-dashboard
{{- end }}
