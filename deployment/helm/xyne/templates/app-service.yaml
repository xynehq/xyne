apiVersion: v1
kind: Service
metadata:
  name: {{ include "xyne.fullname" . }}-app
  labels:
    {{- include "xyne.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.app.port }}
    - name: metrics
      port: {{ .Values.app.metricsPort }}
      targetPort: {{ .Values.app.metricsPort }}
    - name: sync
      port: {{ .Values.app.syncServerPort }}
      targetPort: {{ .Values.app.syncServerPort }}
  selector:
    {{- include "xyne.app.selectorLabels" . | nindent 4 }}
