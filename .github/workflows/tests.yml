name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Ensure system libstdc++ (GLIBCXX for native modules)
        run: |
          sudo apt-get update
          sudo apt-get install -y libstdc++6
          strings /usr/lib/x86_64-linux-gnu/libstdc++.so.6 | grep GLIBCXX || true

      - name: Prefer system libstdc++ for dynamic linker
        run: echo "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
      
      - name: Install Dependencies (Server)
        working-directory: ./server
        run: |
          rm -rf node_modules
          bun install --no-cache

      - name: Clear test cache
        working-directory: ./server
        run: rm -rf node_modules/.cache
        
      - name: Run tests
        working-directory: ./server
        run: bun test --force
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          SERVICE_ACCOUNT_ENCRYPTION_KEY: ${{ secrets.SERVICE_ACCOUNT_ENCRYPTION_KEY }}
          
      - name: Install Dependencies (Frontend)
        working-directory: ./frontend
        run: bun install
        
      - name: Run tests
        working-directory: ./frontend
        run: bun run test 
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          SERVICE_ACCOUNT_ENCRYPTION_KEY: ${{ secrets.SERVICE_ACCOUNT_ENCRYPTION_KEY }}
